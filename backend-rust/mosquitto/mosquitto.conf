# Bind semua interface agar ESP di LAN bisa connect (bukan hanya 127.0.0.1)
listener 1883 0.0.0.0
allow_anonymous true
persistence false
# ponytail: anonymous lokal saja; tambah password/ACL sebelum expose ke internet
connection_messages true
log_type error
log_type warning
log_type notice
log_type information
